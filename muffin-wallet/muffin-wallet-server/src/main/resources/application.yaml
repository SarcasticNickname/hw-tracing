spring:
  application:
    name: muffin-wallet

management:
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: true
        endpoint: ${ZIPKIN_ENDPOINT:http://tempo.observability.svc.cluster.local:9411/api/v2/spans}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://tempo.observability.svc.cluster.local:9411/api/v2/spans}

  endpoints:
    web:
      exposure:
        include: health, prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    use-root-path: true
    urls:
      - name: muffin-wallet-api-v1
        url: /openapi/muffin-wallet-api-v1.yaml

logging:
  file:
    name: ${LOG_PATH:/logs}/app.log
  level:
    root: INFO
