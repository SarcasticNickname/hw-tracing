apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogs:
            datasourceUid: loki
            tags: ["traceId", "trace_id"]
            mappedTags: []
            mapTagNamesEnabled: true
            spanStartTimeShift: "5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            filterBySpanID: false
