{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "muffin-currency.fullname" . }}-promtail
  labels:
    {{- include "muffin-currency.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /logs/promtail-positions.yaml

    clients:
      - url: {{ .Values.promtail.clientUrl | quote }}

    scrape_configs:
      - job_name: muffin-currency-file
        static_configs:
          - targets: [localhost]
            labels:
              job: muffin-currency
              app: muffin-currency
              __path__: /logs/app.log
        pipeline_stages:
          - json:
              expressions:
                level: level
                service: service
                trace_id: trace_id
                span_id: span_id
                traceId: traceId
                spanId: spanId
                message: message
          - labels:
              app:
              level:
              service:
              trace_id:
              traceId:
  {{- end }}
