{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "muffin-wallet.fullname" . }}-promtail
  labels:
    {{- include "muffin-wallet.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /logs/promtail-positions.yaml

    clients:
      - url: {{ .Values.promtail.clientUrl | quote }}

    scrape_configs:
      - job_name: muffin-wallet-file
        static_configs:
          - targets: [localhost]
            labels:
              job: muffin-wallet
              app: muffin-wallet
              __path__: /logs/app.log
        pipeline_stages:
          - json:
              expressions:
                level: level
                service: service
                traceId: traceId
                spanId: spanId
                trace_id: trace_id
                span_id: span_id
                message: message
          - labels:
              app:
              level:
              service:
              traceId:
              trace_id:
{{- end }}
