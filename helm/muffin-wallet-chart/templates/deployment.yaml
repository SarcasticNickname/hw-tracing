apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "muffin-wallet.fullname" . }}
  labels:
    {{- include "muffin-wallet.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "muffin-wallet.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "muffin-wallet.labels" . | nindent 8 }}
    spec:
      containers:
        - name: muffin-wallet
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.env.SPRING_DATASOURCE_URL | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.env.SPRING_DATASOURCE_USERNAME | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.env.SPRING_DATASOURCE_PASSWORD | quote }}
            - name: LOG_PATH
              value: {{ .Values.logs.mountPath | quote }}
            - name: ZIPKIN_ENDPOINT
              value: {{ .Values.tracing.zipkinEndpoint | quote }}
          volumeMounts:
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath | quote }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath | quote }}
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 10

        {{- if .Values.promtail.enabled }}
        - name: promtail
          image: "{{ .Values.promtail.image.repository }}:{{ .Values.promtail.image.tag }}"
          imagePullPolicy: {{ .Values.promtail.image.pullPolicy }}
          args:
            - -config.file=/etc/promtail/config.yaml
          ports:
            - name: promtail
              containerPort: 9080
          volumeMounts:
            - name: logs
              mountPath: {{ .Values.logs.mountPath }}
            - name: promtail-config
              mountPath: /etc/promtail
        {{- end }}

      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: {{ include "muffin-wallet.fullname" . }}-logs

        {{- if .Values.promtail.enabled }}
        - name: promtail-config
          configMap:
            name: {{ include "muffin-wallet.fullname" . }}-promtail
        {{- end }}
